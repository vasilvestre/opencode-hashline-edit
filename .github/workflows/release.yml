name: Release

# Publishes when the version in package.json is not on npm yet.
# Bump "version" in the same commit that ships the change.
# If you forget, this workflow fails instead of publishing a surprise.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read the version
        id: local
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Read the published version
        id: published
        run: |
          set +e
          version=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip when already published
        if: steps.local.outputs.version == steps.published.outputs.version
        run: echo "Version ${{ steps.local.outputs.version }} is already on npm, nothing to do."

      - name: Install
        if: steps.local.outputs.version != steps.published.outputs.version
        run: npm ci

      - name: Test
        if: steps.local.outputs.version != steps.published.outputs.version
        run: npm test

      - name: Build
        if: steps.local.outputs.version != steps.published.outputs.version
        run: npx tsc

      # The 1.1.3 release shipped without .js extensions and could not load.
      # Fail before publishing if the built entrypoint does not import.
      - name: The built plugin loads
        if: steps.local.outputs.version != steps.published.outputs.version
        run: |
          node -e "import('./dist/index.js').then(m => {
            if (!m.default?.id || typeof m.default.setup !== 'function') {
              throw new Error('plugin default export is not a v2 definition')
            }
            console.log('loads:', m.default.id)
          })"

      - name: Publish
        if: steps.local.outputs.version != steps.published.outputs.version
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
